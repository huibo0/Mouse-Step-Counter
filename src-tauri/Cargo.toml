[package]
name = "mouse-step-counter"
version = "0.0.1"
description = "A Tauri App"
authors = ["apollo"]
license = ""
repository = ""
default-run = "mouse-step-counter"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6.1", features = [ "fs-write-file", "dialog-all", "fs-read-file", "window-all", "macos-private-api", "shell-open", "devtools"] }
enigo = "0.3.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
chrono = { version = "0.4.38", features = ["serde", "now"] }
rusqlite = { version = "0.30.0", features = ["bundled", "chrono"] }
uuid = { version = "1.7.0", features = ["v4", "serde"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ] 
